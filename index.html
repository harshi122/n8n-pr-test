<!DOCTYPE html>
<html lang="en">
<head>
  <meta  charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title >Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My tasks</h1>
    <p id="count" class="count">No tasks yet</p>
 
    <div class="add">
      <input id="taskInput" type="text" placeholder="Add a task and press Enter" aria-label="New task">
      <button id="addBtn">Add task</button>
    </div>
 
    <div class="filters" role="group" aria-label="Filter tasks">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="done">Done</button>
    </div>
 
    <ul id="taskList" class="list"></ul>
    <p id="empty" class="empty">Nothing here. Add your first task above.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
